name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: 后端（语法检查 + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 语法检查
        run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: 单元与集成测试
        run: npm test

  web:
    name: 前端（测试 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 单元测试
        run: npm test
      - name: 生产构建
        run: npm run build
