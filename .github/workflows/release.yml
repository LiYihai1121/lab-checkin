name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag（如 v1.1.0）'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: 构建镜像并做容器冒烟验收
    runs-on: ubuntu-latest
    steps:
      - name: 解析目标 tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算镜像名（GHCR 要求全小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: 构建镜像
        run: docker build -t "$IMAGE:${{ steps.tag.outputs.name }}" -t "$IMAGE:latest" .
      - name: 容器冒烟验收（environment 与 version 必须与 tag 一致）
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          EXPECTED_VERSION="${TAG#v}"
          docker run -d --name smoke -e JWT_SECRET=ci-smoke-secret -p 127.0.0.1:3000:3000 "$IMAGE:$TAG"
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health -o health.json; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { docker logs smoke; echo '健康探活超时'; exit 1; }
          cat health.json
          grep -q '"environment":"production"' health.json || { echo 'environment 断言失败'; exit 1; }
          grep -q "\"version\":\"$EXPECTED_VERSION\"" health.json || { echo 'version 断言失败'; exit 1; }
          docker rm -f smoke
      - name: 推送镜像到 GHCR
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.name }}"
          docker push "$IMAGE:latest"
